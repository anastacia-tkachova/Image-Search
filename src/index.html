<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta property="og:title" content="Image Search & Pagination Engine" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anastacia-tkachova.github.io/image-search/" />
    <meta property="og:image" content="../assets/image-search.png" />
    <meta property="og:description" content="A dynamic image search application that interacts with the Pixabay API." />
    <meta property="og:site_name" content="Image Search" />
    
    <title>Image Search</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <form class="form">
          <label>
            <input
              type="text"
              name="search-text"
              placeholder="Search images..."
              required
            />
          </label>
          <button type="submit">Search</button>
        </form>

        <span class="span-loader"></span>

        <ul class="gallery"></ul>

        <button type="button" class="load-more-button hidden">Load more</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
